name: Deploy API Tier to VMSS

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ------------------------------------------------------------------
  # 1. Run the test suite on every push before anything deploys
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api   # <-- Runs npm commands inside /api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 'api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ------------------------------------------------------------------
  # 2. App/API tier -> VMSS instances (rolling update via run-command)
  # ------------------------------------------------------------------
  deploy-api:
    name: Deploy API Tier
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pushes latest code to EVERY instance and restarts the Node process.
      - name: Rolling update on all VMSS instances
        run: |
          # 1. Fetch all active instance IDs in the VMSS
          INSTANCE_IDS=$(az vmss list-instances \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "demo-vmss" \
            --query "[].instanceId" -o tsv)
         
          # 2. Loop through each instance and run the deployment script
          for ID in $INSTANCE_IDS; do
            echo "Deploying to VMSS instance: $ID"
            az vmss run-command create \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --vmss-name "demo-vmss" \
              --name unn-sug-deploy \
              --instance-id "$ID" \
              --script "set -e; \
                cd /opt/unn-sug-api; \
                git fetch origin main; \
                git reset --hard origin/main; \
                cd /opt/unn-sug-api/api; \
                npm ci --omit=dev; \
                pm2 restart unn-sug-api || pm2 start server.js --name unn-sug-api; \
                sleep 3; \
                curl -fsS http://localhost:3000/api/health"
          done   # <-- Added missing 'done' to close the loop

      # 3. Check API health via Load Balancer
      - name: Health check via Load Balancer
        run: |
          for i in {1..12}; do
            if curl -fsS "http://${{ secrets.LB_PUBLIC_IP }}/api/health"; then
              echo "API tier healthy via LB"
              exit 0
            fi
            echo "Waiting for API tier... ($i/12)"
            sleep 10
          done
          echo "API tier failed health check" >&2
          exit 1
