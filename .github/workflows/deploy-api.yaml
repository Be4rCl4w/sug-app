name: Deploy API Tier to VMSS

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ------------------------------------------------------------------
  # 1. Run the test suite on every push before anything deploys
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 'api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ------------------------------------------------------------------
  # 2. App/API tier -> VMSS instances (rolling update via run-command)
  # ------------------------------------------------------------------
  deploy-api:
    name: Deploy API Tier
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pushes latest code, writes .env, and restarts the Node process on EVERY instance
      - name: Rolling update on all VMSS instances
        env:
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          INSTANCE_IDS=$(az vmss list-instances \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "demo-vmss" \
            --query "[].instanceId" -o tsv)
         
          for ID in $INSTANCE_IDS; do
            echo "Deploying to VMSS instance: $ID"
            az vmss run-command create \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --vmss-name "demo-vmss" \
              --name unn-sug-deploy \
              --instance-id "$ID" \
              --script "set -e; \
                cd /opt/unn-sug-api; \
                git fetch origin main; \
                git reset --hard origin/main; \
                cd /opt/unn-sug-api/api; \
                printf 'PORT=3000\nDB_SERVER=%s\nDB_NAME=%s\n' '${{ secrets.DB_SERVER }}' '${{ secrets.DB_NAME }}' > .env; \
                npm ci --omit=dev; \
                pm2 restart unn-sug-api --update-env || pm2 start server.js --name unn-sug-api; \
                pm2 save; \
                sleep 3; \
                curl -fsS --noproxy '*' http://127.0.0.1:3000/api/health"
          done

      # 3. Simple inline query to fetch Load Balancer IP and check health
      - name: Health check via Load Balancer IP
        run: |
          LB_IP=$(az network lb list -g "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[0].frontendIpConfigurations[0].publicIpAddress.id" -o tsv | xargs -r -I {} az network public-ip show --ids {} --query ipAddress -o tsv)
          
          echo "Resolved LB IP: $LB_IP. Starting health checks..."

          for i in {1..12}; do
            if curl -fsS --max-time 10 "http://$LB_IP/api/health"; then
              echo "API tier healthy via LB ($LB_IP)"
              exit 0
            fi
            echo "Waiting for API tier... ($i/12)"
            sleep 10
          done
          echo "API tier failed health check" >&2
          exit 1