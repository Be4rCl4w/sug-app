name: Deploy Web Tier to Linux App Service

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '24'

jobs:
  # ------------------------------------------------------------------
  # 1. Run the test suite on every push before anything deploys
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api   # <-- Runs npm commands inside /api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 'api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ------------------------------------------------------------------
  # 2. Web tier -> Azure App Service (static index.html)
  # ------------------------------------------------------------------
  deploy-web:
    name: Deploy Web Tier
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: './web'

      - name: Smoke test web tier
        run: |
          sleep 15  # allow app to restart and come up
          curl -fsSL "http://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/" | grep -q "UNN SUG"